<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>水印清除助手</title>
  <style>
    :root { --bg:#0c0d12; --panel:#171923; --line:#2a2d3b; --muted:#9297aa; --text:#f2f3f6; --violet:#8b71ff; --pink:#ff3e68; --green:#45d39c; }
    * { box-sizing:border-box } body { margin:0; font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text) }
    main { max-width:1060px; margin:auto; padding:42px 24px 64px } header { text-align:center; margin-bottom:28px } h1 { font-size:30px; margin:0; background:linear-gradient(135deg,#a28bff,#ff7d9d); color:transparent; background-clip:text } header p,.hint { color:var(--muted); margin:7px 0 0 }
    .drop { border:2px dashed var(--line); background:var(--panel); border-radius:18px; padding:56px 24px; text-align:center; cursor:pointer; transition:.2s } .drop:hover,.drop.over{border-color:var(--violet);background:#1d2030}.drop strong{display:block;font-size:17px}.drop span{color:var(--muted);font-size:13px}.drop input{display:none}
    #work { display:none; margin-top:22px }.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.preview{min-height:440px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#171923 0 25%,#1e2030 0 50%) 50%/20px 20px;border-radius:12px;overflow:hidden}.preview img{max-width:100%;max-height:500px;display:block}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 9px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{padding:10px;border:1px solid var(--line);border-radius:10px;background:#202331;color:var(--text);cursor:pointer}.mode.active{border-color:var(--violet);background:#322b61}.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;color:var(--muted);font-size:13px}.row input,.row select{width:116px;background:#202331;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,.button{font:inherit;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(135deg,var(--violet),#b37cff);color:white;font-weight:700}.secondary{color:var(--text);background:#262936;border:1px solid var(--line)}#progress{color:var(--muted);margin:14px 0 0;font-size:13px}.thumbs{display:flex;gap:9px;overflow:auto;margin-bottom:12px}.thumb{width:68px;height:68px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer}.thumb.active{border-color:var(--violet)}
    .xhs-tab{position:fixed;right:0;top:43%;width:36px;height:108px;border-radius:18px 0 0 18px;background:#17181f;border:1px solid #353640;border-right:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}.xhs-tab b{writing-mode:vertical-rl;font-size:12px;color:#f9e9ed}.xhs{position:fixed;right:18px;top:50%;transform:translateY(-50%) translateX(470px);width:420px;padding:32px;background:#101011;border:1px solid #33343a;border-radius:28px;box-shadow:0 20px 70px #000a;transition:.3s;z-index:11}.xhs.show{transform:translateY(-50%) translateX(0)}.xhs-close{position:absolute;right:20px;top:14px;color:#92929b;font-size:28px;cursor:pointer}.xhs-icon{width:72px;height:72px;border-radius:22px;background:linear-gradient(140deg,#ff274f,#ff6380);display:grid;place-items:center;font-size:34px}.xhs small{color:#777984;font-size:18px}.xhs h2{margin:7px 0;font-size:24px}.xhs p{color:#9b9ba5;font-size:18px;margin:0 0 28px}.xhs a{display:block;text-align:center;padding:20px;background:linear-gradient(135deg,#ff234c,#ff4770);color:white;font-size:22px;font-weight:700;border-radius:22px;text-decoration:none}.xhs em{display:block;text-align:center;color:#555660;font-size:14px;margin-top:20px;font-style:normal}@media(max-width:780px){.grid{grid-template-columns:1fr}.xhs{width:calc(100% - 28px);right:14px}.xhs-tab{top:auto;bottom:24px}.preview{min-height:250px}}
  </style>
</head>
<body>
  <main>
    <header><h1>水印清除助手</h1><p>本地处理图片 · 可见水印、不可见标记与 AI 元数据</p></header>
    <label class="drop" id="drop"><strong>拖放图片到这里，或点击选择</strong><span>支持 PNG / JPG / WebP / BMP / TIFF，每次最多 10 张</span><input id="files" type="file" accept="image/*" multiple></label>
    <section id="work"><div class="thumbs" id="thumbs"></div><div class="grid"><div class="card"><div class="preview"><img id="preview" alt="待处理图片"></div></div><aside class="card"><p class="label">处理模式</p><div class="modes"><button class="mode active" data-mode="all">一键处理</button><button class="mode" data-mode="visible">可见水印</button><button class="mode" data-mode="invisible">不可见标记</button><button class="mode" data-mode="metadata">清除元数据</button></div><p class="label" style="margin-top:22px">高级选项</p><label class="row">去噪强度 <input id="strength" type="number" min="0" max="1" step="0.01" value="0.05"></label><label class="row">修复算法 <select id="inpaint"><option value="ns">Navier-Stokes</option><option value="telea">Telea</option><option value="gaussian">Gaussian</option></select></label><label class="row">设备 <select id="device"><option value="auto">自动选择</option><option value="cpu">CPU</option><option value="cuda">NVIDIA CUDA</option></select></label><p class="hint">不可见标记模式首次使用可能需要联网下载模型。</p></aside></div><div class="actions"><button class="primary" id="process">开始处理</button><a class="button secondary" id="download" hidden>下载处理结果</a></div><div id="progress"></div></section>
  </main>
  <div class="xhs-tab" id="xhsTab"><b>小红书推荐</b></div><aside class="xhs" id="xhs"><span class="xhs-close" id="xhsClose">×</span><div class="xhs-icon">▣</div><small>小红书</small><h2>疯狂 AIGC 商业视觉</h2><p>AIGC 商业视觉创作者，分享 AI 设计工作流与创意灵感。</p><a id="xhsLink" target="_blank" rel="noopener">关注我的小红书 ↗</a><em>点击跳转小红书主页</em></aside>
  <script>
    let records=[], selected=0, mode='all'; const $=s=>document.querySelector(s); const drop=$('#drop'), input=$('#files'), work=$('#work'), progress=$('#progress');
    fetch('/api/config').then(r=>r.json()).then(c=>$('#xhsLink').href=c.xiaohongshu_url);
    $('#xhsTab').onclick=()=>$('#xhs').classList.add('show'); $('#xhsClose').onclick=()=>$('#xhs').classList.remove('show');
    drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');upload(e.dataTransfer.files)};input.onchange=()=>upload(input.files);
    document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});
    async function upload(list){const data=new FormData();[...list].slice(0,10).forEach(f=>data.append('file',f));const r=await fetch('/api/upload',{method:'POST',body:data}),d=await r.json();if(!r.ok)return alert(d.error);records=d.files;selected=0;drop.hidden=true;work.style.display='block';render()}
    function render(){const thumbs=$('#thumbs');thumbs.innerHTML='';records.forEach((f,i)=>{const img=new Image();img.className='thumb '+(i===selected?'active':'');img.src='/api/preview/'+f.filename;img.onclick=()=>{selected=i;render()};thumbs.append(img)});$('#preview').src='/api/preview/'+records[selected].filename}
    $('#process').onclick=async()=>{const f=records[selected];progress.textContent='正在处理，请稍候…';$('#download').hidden=true;const r=await fetch('/api/process/'+f.job_id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.filename,mode,options:{strength:+$('#strength').value,inpaint_method:$('#inpaint').value,device:$('#device').value}}),d=await r.json();if(!r.ok){progress.textContent='处理失败：'+d.error;return}progress.textContent='处理完成。';$('#preview').src='/api/preview/'+d.output+'?t='+Date.now();const a=$('#download');a.href='/api/download/'+d.output;a.hidden=false};
  </script>
</body>
</html>
